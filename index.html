P("x3","X3 footprint (HSE 25 MHz, not fitted)","Optional 25 MHz HSE crystal (6 pF, 20 ppm). The manual says the crystal is not provided with the board.",X,[[167,352]],[12,10,.1],{x:"To use it: SB44 and SB46 OFF, SB3 and SB4 ON, C69 and C70 ON with 5.6 pF capacitors, SB45 OFF. By default the HSE comes from ST-LINK’s 8 MHz MCO instead (SB45 ON, SB3, SB4, SB44, SB46 OFF)."}),
P("u2","U2 power switch (board 5 V)","Switches ST-LINK’s 5 V onto the board once USB enumeration succeeds. It limits current to protect the PC.","#25262b",[[172,20]],[18,18,.1],{x:"Enabled by PWR_ENn from U7. If more than 500 mA is drawn, LD6 lights. The manual quotes 5 V/300 mA capability with limitation and LED, and says to use an external supply (E5V, VIN or 3V3) if board plus shield can exceed 300 mA."}),
P("u1","U1 / U10 debug level shifters","Voltage translation between ST-LINK and the target’s debug pins, so SWD works at 1.8 V or 3.3 V VDD_MCU.","#25262b",[[45,20],[72,78]],[16,18,.1],{x:"SB5 must be OFF because the MCU can run at 1.8 V and needs U10. If the MCU is at 3.3 V, SB5 ON can bypass U10. For Rev C low-power tests the manual lists U1 and U10 among parts to remove."}),
P("u11","U11 (beside TP1 / SB2)","Sits beside TP1 (3V3) and SB2, so probably the 3.3 V regulator ST1L05CPU33R (inferred from placement). SB2 connects that regulator’s output to 3V3.","#25262b",[[263,108]],[16,18,.1]),
P("u89","U8 / U9 (ST-LINK area)","Small ICs in the ST-LINK section that UM2407 doesn’t name.","#25262b",[[68,53],[202,72]],[14,16,.1]),
P("u18","U18 USB OTG power switch","Switches +5 V onto VBUS of CN13 in Host mode. Enabled by PD10 (SB77) and reports overcurrent on PG7 (SB76).","#25262b",[[130,539]],[14,10,.08]),
P("usbmisc","Other small ICs (U5, U6, U19, U21–U23, U27)","Not described in UM2407. They sit by the USB ports and are probably protection or power-path parts (inferred).","#25262b",[[218,33],[230,38],[97,553],[83,563],[132,563],[248,545]],[12,10,.08]),
P("ld7","LD7 red (USB OTG overcurrent)","Lights if overcurrent occurs while +5 V is enabled on VBUS in USB Host mode.",LD,[[127,584]],[8,8,.06],{led:"#ff3b3b"}),
P("ld8","LD8 green (USB VBUS)","Lights when the USB power switch is ON in Host mode, or when another host powers VBUS in Device mode.",LD,[[153,583]],[8,8,.06],{led:"#39ff5a"}));
const UP={
mcu:{n:"U14 STM32H723ZGT6 (target MCU)",d:"The chip your code runs on: Arm Cortex-M7 with FPU, up to 550 MHz, 1 MB flash, in a 144-pin LQFP.",x:"Revision ‘Z’ silicon (errata sheet ES0491). VDD_MCU is 3.3 V by default and 1.8 V via JP5. All its signals and power pins reach the morpho headers. The board feeds it an 8 MHz clock from ST-LINK (MCO), which Zephyr multiplies to 550 MHz."},
stl:{n:"U7 STM32F723IEK6 (STLINK-V3E)",d:"The on-board STLINK-V3E debugger/programmer. For STM32H7 it supports SWD, SWV and the virtual COM port over USB 2.0 high-speed.",x:"Re-enumerates as a composite USB device: virtual COM port, mass storage and debug port. Firmware can be upgraded in place over USB, and ST recommends keeping it current. Its PWR_ENn pin drives power switch U2. SWO from PB3 reaches it through SB32. Its MCO supplies the 8 MHz HSE."},
x1:{d:"Crystal beside the ST-LINK MCU. The manual doesn’t describe it; it clocks the debugger, separate from the target."},
usbstl:{n:"CN1 STLINK-V3E USB (Micro-B)",d:"Connects ST-LINK to your PC: power, programming, debugging and the virtual COM port. Default power input.",x:"Pins: 1 VBUS (5V_USB_CHGR), 2 DM (ST-LINK PB14), 3 DP (PB15), 4 ID (unused), 5 GND. Use a Type-A or Type-C to Micro-B cable. LD4, LD5 and LD6 sit beside it."},
usbotg:{n:"CN13 USB OTG_FS (Micro-AB)",d:"USB OTG full-speed, Host and Device. It cannot power the board, so power the board before plugging in.",x:"Pins: 1 VBUS PA9, 2 DM PA11, 3 DP PA12, 4 ID PA10, 5 GND. U18 switches VBUS. ESD protection sits on the data lines. SB76 must be ON for OTG_FS. Plugging CN13 into an unpowered board risks current injection into the STM32H7 I/Os."},
eth:{n:"CN14 Ethernet RJ45",d:"10/100 Mbps Ethernet (IEEE-802.3). Integrated LEDs: green = traffic, amber = connection.",x:"Connected to the MCU through PHY U15 over RMII. JP6 and SB72 must be ON when using Ethernet. Pins: 1 TX+, 2 TX−, 3 RX+, 6 RX−, 4/5/7/8 NC, 9–12 the two LEDs."},
mag:{d:"Magnetics module between the RJ45 and the PHY: isolates and filters the line. Not named in UM2407; identified from its marking and position."},
phy:{n:"U15 Ethernet PHY",d:"Connects to the MCU over RMII. Its RMII_REF_CLK output generates the 50 MHz clock for the MCU.",x:"Clocked by X4 at 25 MHz. SB74 ties NRST to the PHY. For low-power tests, set the PHY’s basic control register (0x00) bit 11 to 1 (power-down) or open SB57. On Rev C boards the PHY shared VDD_MCU; your E01 board powers it separately."},
u16:{d:"Small IC beside the PHY. UM2407 doesn’t describe it, and I can’t identify it from the picture."},
x4:{n:"X4 oscillator (PHY, 25 MHz)",d:"Generates the 25 MHz clock for the Ethernet PHY. The PHY then supplies the 50 MHz reference to the MCU."},
l1:{d:"Inductor near the PHY supply filtering. UM2407 doesn’t describe it (inferred from placement)."},
ld1:{n:"LD1 green (PB0)",d:"Green user LED, on when the I/O is HIGH. Default PB0 (SB39 ON, SB47 OFF).",x:"Alternative: PA5 / Arduino D13 with SB47 ON and SB39 OFF. Both OFF leaves it disconnected. Both ON is forbidden. Zephyr’s blinky uses it."},
ld2:{d:"Yellow user LED on PE1, on when the I/O is HIGH."},
ld3:{d:"Red user LED on PB14, on when the I/O is HIGH. The demo firmware blinks it at power-up."},
ld4:{n:"LD4 COM LED (red/green/orange)",d:"ST-LINK communication status. Default colour is red.",x:"Slow red blink at power-on before USB init. Fast red blink after the first enumeration. Steady red when init is complete. Green after a successful target connection. Blinking red/green while talking to the target. Steady green when finished OK. Orange on failure."},
ld5:{n:"LD5 PWR (green)",d:"Lights when the STM32H7 part is powered. +5 V is then on CN8 pin 9 and CN11 pin 18."},
ld6:{n:"LD6 USB power fault (red)",d:"Lights when the board draws more than 500 mA from USB. Then power it from an external supply."},
b1:{n:"B1 USER button (PC13)",d:"Blue button on PC13 (tamper, SB51 ON, SB58 OFF) or PA0 (wake-up, SB58 ON, SB51 OFF).",x:"Both bridges OFF disconnects it. Set SB51 OFF if the Zio connector uses PA0. In the demo firmware it changes the LED blink rate. Zephyr maps it to USER_PB on PC13."},
rst:{n:"B2 RESET button",d:"Black button connected to NRST. It resets the STM32H7.",x:"JP3 also connects NRST to ST-LINK’s reset control (T_NRST)."},
jp1:{n:"JP1 STLK_RST",d:"Default OFF (no effect). ON holds ST-LINK in reset with all its GPIOs high-impedance, which saves power and frees CN5 for an external debugger."},
cn2:{n:"CN2 DFU connector",d:"Labelled DFU connector in UM2407’s layout figure. The manual doesn’t describe its pins; ST-LINK firmware is normally upgraded in place over USB."},
cn5:{n:"CN5 MIPI-10 debug (STDC14-compatible)",d:"Connector for an external debug tool: T_VCC, T_SWDIO, T_SWCLK, T_SWO, T_NRST and grounds.",x:"Two ways to use an external probe: keep ST-LINK running (power it first until COM LED is red, then connect), or fit JP1 so ST-LINK is in reset. STDC14 pins 13 and 14 carry T_VCP_RX/TX and must go to a UART dedicated to the bootloader. Full pins are in Connectors."},
jp2:{n:"JP2 power source selection",d:"[1-2] STLINK 5 V from USB (default), [3-4] VIN 7–12 V, [5-6] EXT 5 V, [7-8] CHGR USB charger.",x:"No jumper at all is used for a 3.3 V external supply, which leaves ST-LINK unpowered and disables debugging. See the Power tab."},
jp3:{n:"JP3 T_NRST",d:"Default ON: connects the board NRST to ST-LINK’s reset control I/O. OFF disconnects it."},
jp4:{n:"JP4 IDD",d:"Default ON. Remove it and connect an ammeter to measure MCU current. With it OFF and no ammeter, the MCU is not powered.",x:"Rev C boards had a standby-measurement limitation (PHY on VDD_MCU). Your E01 board has none. For Rev C the manual lists R4, R43–R53, R59, R61, U1, U10, U15 and SB45 to remove, which disables Ethernet and 1.8 V debug."},
jp5:{n:"JP5 VDD_MCU selection",d:"[1-2] 3V3_VDD (default), [2-3] 1V8_VDD. Chooses the MCU supply level.",x:"At 1.8 V the debug level shifter U10 is needed (SB5 OFF). The MCU I/Os are 3.3 V-compatible, not 5 V."},
jp6:{n:"JP6 RMII TXD1",d:"Links PB13 to the PHY’s TXD1. Must be ON (with SB72) when using Ethernet.",x:"PB13 is also I2S_A_CK on Zio CN7 pin 5 (D18). With JP6 ON, use only one of Ethernet or I2S_A."},
u12:{n:"U12 (SOT-223, 5V_VIN path)",d:"Regulator on the VIN-to-5 V path, identified from the silkscreen. UM2407 doesn’t name it.",x:"VIN must be 7–12 V. Input current depends on VIN: 800 mA at 7 V, 450 mA at 7–9 V, 250 mA at 9–12 V (manual Table 6)."},
u13:{n:"U13 (beside SB80 / TP2)",d:"Sits beside SB80 and TP2, so probably the 1.8 V regulator ST1L05BPUR (inferred from placement). SB80 connects its output to 1V8_VDD.",x:"SB6 connects its input to 3V3_VDD."},
cn7:{n:"CN7 ST Zio",d:"Zio connector, female on top and male underneath. SPI, I2S, I2C and Arduino pins D8–D25 plus VREFP.",x:"SPI_A is D13/D12/D11/D10 = PA5/PA6/PB5/PD14. D11 is PB5 (SB33 OFF, SB35 ON) or PA7 (SB33 ON, SB35 OFF). D18 (PB13) shares RMII_TXD1 with JP6. R37 must be OFF before an Arduino shield supplies VREF+ on pin 6."},
cn8:{n:"CN8 ST Zio",d:"Power pins (IOREF, NRST, 3V3, 5V, GND, VIN) plus SDMMC D0–D3, CK, CMD and I/O.",x:"Pin 15 VIN takes 7–12 V. Pin 7 3V3 is an input or output. Pin 9 is the 5 V output. Pin 1 is NC."},
cn9:{n:"CN9 ST Zio",d:"Analog A0–A5, USART_B, SAI, I2C_B, CAN_1 and comparator pins.",x:"CAN_RX is PD0 (pin 25) and CAN_TX is PD1 (pin 27), with no on-board transceiver. A4/A5 are ADC by default or I²C (PB9/PB8) via SB55/SB62. PE2 is shared with QSPI_BK1_IO2 (CN10 pin 25), so use only one."},
cn10:{n:"CN10 ST Zio",d:"AVDD and AGND, TIM1 PWM, Quad-SPI, LPUART1 (D0/D1) and ADC inputs A6–A8.",x:"D0/D1 are PB7/PB6 on LPUART1. A6–A8 are PF4/PF5/PF6 through SB37/38, SB48/49 and SB50/54."},
cn11:{n:"CN11 ST morpho (2×35 male)",d:"Every STM32H7 signal and power pin reaches the morpho headers. Soldered by default.",x:"Pin 7 is BOOT0 (default 0, a jumper on pins 5–7 sets 1). PA13/PA14 (pins 13/15) are shared with SWD, so ST doesn’t recommend them as I/O. Pin 6 is 5V_EXT, 24 VIN, 16 3V3 and 18 5V."},
cn12:{n:"CN12 ST morpho (2×35 male)",d:"Second morpho header: USB, QSPI, SDMMC, Ethernet RMII and many more signals.",x:"Pin 8 is 5V_USB_STLK, ST-LINK’s 5 V, which rises before the board’s +5 V."},
tps:{d:"Gold test pads. TP1 is marked 3V3. TP4 is the USB SOF signal (PA8). UM2407 doesn’t describe TP2 and TP3."},
sbf:{n:"Front solder bridges (SB2, SB3, SB4, SB80)",d:"SB2: 3V3 regulator output to 3V3. SB80: 1V8 regulator output to 1V8_VDD. SB3 and SB4: connect the optional X3 crystal to PF0 and PF1 (OFF by default).",x:SBN},
gndh:{d:"GND hooks for clipping a scope or meter ground."},
holes:{d:"Mounting holes. The mechanical drawing is in UM2407 section 7.2."},
sticker:{n:"Product sticker area",d:"Blank in the render. Real stickers show the order code, product ID, serial number and board reference.",x:"Your product ID NUH723ZG$AT2 means a carton-box package (AT1 used a blister). Board MB1364-H723ZG-E01, MCU revision ‘Z’, no limitations. ‘ES’ or ‘E’ marks mean unqualified engineering samples."},
pmcu:{n:"MCU decoupling capacitors (C46–C58, C61–C72)",d:"Capacitors beside the MCU’s supply pins that absorb fast current spikes. C69 and C70 (5.6 pF) are only fitted for the optional X3 crystal.",x:"R36/R37 sit nearby. Remove R37 before using an Arduino shield that supplies VREF+."},
pclk:{n:"MCU clock and reset parts (R33–R41)",d:"Resistors around the clock and reset lines. R38 and R39 belong to the LSE setup and are ON by default."},
pstl:{n:"ST-LINK support parts (C11–C27, R10–R23)",d:"Capacitors and resistors for the ST-LINK MCU. R4 is in the manual’s Rev C low-power removal list."},
peth:{n:"Ethernet support parts (R42–R53, C73–C82)",d:"Pull-ups and decoupling for the PHY. R43, R46, R47 and R48 (and R40) pull-ups were powered from VDD_MCU on Rev C boards."},
potg:{n:"USB and power-path parts (R54–R66, C83–C85)",d:"Resistors and capacitors around the OTG port and its power switch."},
pled:{d:"R26–R28: one current-limiting resistor for each user LED."},
ppwr:{d:"Capacitors and resistors around the regulators and the JP2 power selector."},
bcn34:{n:"CN3 / CN4 (back, top corners)",d:"Jumper headers on the back top corners. UM2407 doesn’t describe them."},
bcn1516:{n:"CN15 / CN16 (back, bottom corners)",d:"CN15 gives access to USART1 (PB10/PB11) for the USART bootloader wiring. UM2407 doesn’t describe CN16.",x:"To use the USART bootloader, connect flying wires between PD8/PD9 (USART3 on SB19/SB12) and PB10/PB11 (USART1 on CN15)."},
bd:{d:"Three small SOT-23 parts. UM2407 doesn’t describe them; see the schematic."},
bq:{d:"Three small transistors with resistors R68–R73. UM2407 doesn’t describe them; see the schematic."},
bu24:{d:"Small IC on the back. UM2407 doesn’t describe it."},
brr:{d:"Small resistor group on the back. Not described in UM2407."},
sbA:{n:"SB12, SB18, SB19, SB82, SB87–SB89",d:"Virtual COM port routing. SB12 and SB19 are ON by default: ST-LINK to PD9 / PD8 (USART3). SB18 and SB82 route PD8 elsewhere.",x:"PD8 TX: VCP uses SB19 ON (SB9, SB18, SB82 OFF), morpho uses SB82 ON (SB18, SB19 OFF). PD9 RX: VCP uses SB12 ON, morpho uses SB81 ON (SB12, SB66 OFF). SB87–SB89 aren’t described in the manual."},
sbB:{n:"SB13–SB17",d:"SB13: VDD33_USB_1 to 3V3_VDD. SB14, SB15: SDMMC_D0/D1 to CN12. SB16, SB17: USB D−/D+ to morpho.",x:"SB14/SB15 OFF avoids stubs on the SDMMC data lines. SB16/SB17 ON only when SB21/SB22 are OFF."},
sbC:{n:"SB21–SB25",d:"USB routing: SB21/SB22 PA11/PA12 to CN13 D−/D+, SB23 PA9 to VBUS, SB24 PA10 to ID, SB25 VDD_MMC_1 to VDD_MCU.",x:"OFF frees the pins as GPIOs on morpho."},
sbD:{n:"SB26, SB28, SB29, SB31, SB33, SB35",d:"SB29: PC5 to RMII RXD1. SB31: PA7 to RMII CRS_DV. SB28: PE9 to Zio CN10 pin 4. SB33/SB35: D11 on PB5 or PA7. SB26 must be OFF when SB32 is ON.",x:SBN},
sbE:{n:"SB27, SB30, SB32, SB34",d:"SB27: PG11 to RMII TX_EN. SB30: PG13 to RMII TXD0. SB32: PB3 SWO to ST-LINK. SB34: PB7 LPUART1 RX route.",x:SBN},
sbF:{n:"SB36–SB49",d:"SB36 PC4 to RMII RXD0. SB37/38/48/49 select ADC inputs A6/A7. SB39/SB47 choose LD1 on PB0 or PA5. SB40/41 LSE pins. SB44/45/46 HSE routing.",x:"SB39 ON and SB47 OFF is the default for LD1. Both ON is forbidden. SB45 ON sends ST-LINK’s MCO to PF0/PH0 (default HSE)."},
sbG:{n:"SB50–SB70",d:"SB51/SB58 select B1 on PC13 or PA0. SB52 connects VBAT to VDD_MCU. SB57/SB64 are RMII PA1/PC1. SB53/60/55/62 route A4/A5. SB59/SB63 are QSPI.",x:"SB52: remove it to disconnect VBAT from VDD_MCU for backup-SRAM tests. SB66/SB68 route PB7 LPUART1 RX. SB67 PE2. SB69 COMP1. SB70 PE9. SB65 PF11 is GPIO only."},
sbH:{n:"SB72–SB75",d:"SB72: PA2 to the Ethernet PHY MDIO (must be ON for Ethernet). SB73: PE6 route. SB74: NRST to the PHY. SB75: PA0 to Zio CN10 pin 29.",x:"SB71/SB73 pick PE6 as SAI_A_SD (D59) or TIMER_A_BKIN2 (D38)."},
sbI:{n:"SB76–SB79, SB81",d:"SB76: PG7 USB overcurrent (needed for OTG_FS). SB77: PD10 to the USB power switch. SB81: PD9 USART RX to morpho CN11.",x:"SB78 and SB79 aren’t described in the manual."},
sbJ:{n:"SB5, SB6, SB11, SB20",d:"SB5: OFF keeps level shifter U10 in use. SB6: 1V8 regulator input from 3V3_VDD. SB10/SB11/SB20 choose IOREF.",x:"IOREF: OFF/ON/OFF = VDD_MCU, ON/OFF/OFF = 3V3_PER, OFF/OFF/ON = 3V3."},
bmk:{n:"Logos and compliance marks",d:"ST logo, FC and CE marks, RoHS, WEEE bin and the environmental-use symbol. They’re printed on the PCB and do nothing electrically.",x:"The manual covers FCC Part 15 class B, ISED ICES-003 class B, UKCA and CE (RoHS, EMC). Use shielded cables. In Europe, recycle the board separately under WEEE."}};
Object.entries(UP).forEach(([id,u])=>N.parts.filter(p=>p.id===id).forEach(p=>Object.assign(p,u)));

N.more=sc2("How the board is organised",ul(["<b>ST-LINK part</b>: STLINK-V3E with SWD, a virtual COM UART and USB to your PC.","<b>MCU part</b>: the STM32H723ZG with buttons, LEDs, USB OTG, Ethernet over RMII, Zio and morpho headers.","The same MB1364 board design is used for NUCLEO-H743ZI2 and NUCLEO-H753ZI.","Your board’s sticker ID NUH723ZG$AT2 and silkscreen MB1364E match revision MB1364-H723ZG-E01."]));
N.pins=[["PD8 / PD9","USART3 TX / RX","ST-LINK virtual COM port (SB19, SB12 ON). Zephyr console, 115200 8N1"],["PC13","B1 USER","Default (SB51 ON, SB58 OFF). Zephyr USER_PB"],["PB0 / PE1 / PB14","LD1 / LD2 / LD3","User LEDs, on when HIGH"],["PB8 / PB9","I2C1 SCL / SDA","Zio D15 / D14, Zephyr default"],["PD14 / PA5 / PA6 / PB5","SPI1 CS / SCK / MISO / MOSI","Zio D10 / D13 / D12 / D11"],["PD0 / PD1","FDCAN1 RX / TX","Zio D67 / D66, no on-board transceiver"],["PB7 / PB6","LPUART1 RX / TX","Zio D0 / D1"],["PA9 / PA10 / PA11 / PA12","USB VBUS / ID / DM / DP","CN13"],["PD10 / PG7","USB power enable / overcurrent","SB77 / SB76"],["PA1 PA2 PC1 PA7 PC4 PC5 PG11 PG13 PB13","RMII REF_CLK MDIO MDC CRS_DV RXD0 RXD1 TX_EN TXD0 TXD1","Ethernet PHY U15"],["PA13 / PA14","SWDIO / SWCLK","Shared with ST-LINK SWD, avoid as I/O"],["PF0 / PF1","HSE in / out","8 MHz from ST-LINK MCO (SB45)"],["PC14 / PC15","LSE in / out","32.768 kHz crystal X2"],["PB3","SWO","SB32"],["BOOT0","CN11 pin 7","0 by default, jumper CN11 [5-7] sets 1"]];
N.note="Sources: UM2407 Rev 6 and the Zephyr docs for Nucleo H723ZG.";

N.power=sc2("Five ways to power the board",tb(["Source","Where","JP2","Range","Max current"],"USB from a PC (default)|CN1|[1-2] STLINK|5 V|500 mA (U2 limits it, LD6 lights above)\x3bVIN|CN8 pin 15 or CN11 pin 24|[3-4] VIN|7–12 V|800 mA at 7 V, 450 mA at 7–9 V, 250 mA at 9–12 V\x3bE5V (5V_EXT)|CN11 pin 6|[5-6] EXT|4.75–5.25 V|500 mA\x3bUSB charger|CN1|[7-8] CHGR|5 V|not stated, no debugging\x3b3V3 external|CN8 pin 7 or CN11 pin 16|no jumper|3–3.6 V|1.3 A, ST-LINK unpowered so no programming or debug".replace(/\x3b/g,";")))+sc2("Rules to follow",ul(["Use a supply that complies with EN 62368-1:2014+A11:2017: safety extra-low voltage (SELV) with limited power.","USB: ST-LINK gets 100 mA before enumeration, then requests 500 mA. If the host can’t provide it, enumeration fails, U2 stays off and LD5 stays off. Then you must use an external supply.","If the board plus shield can draw more than 300 mA, power it from E5V, VIN or 3V3, not USB.","Debugging with VIN or EXT: set JP2 [3-4] or [5-6], connect and switch on the external supply, check that LD5 is on, then connect USB to CN1. If you plug USB first, VBUS may power the board: a PC can be damaged or limit the current, and enumeration may fail.","CN13 (USB OTG) cannot power the board. Power the board first, then connect CN13.","+5 V is on CN8 pin 9 and CN11 pin 18 once LD5 is on.","VDD_MCU is 3.3 V by default and 1.8 V with JP5 [2-3]. MCU I/Os are 3.3 V logic, not 5 V."]));
N.cfg=sc2("Default jumpers",tb(["Jumper","Function","Default"],"JP1|STLK_RST|OFF\x3bJP2|Power source|ON [1-2] 5V_USB_STLK\x3bJP3|T_NRST|ON\x3bJP4|IDD measurement|ON\x3bJP5|VDD_MCU|ON [1-2] 3V3_VDD (optional [2-3] 1V8_VDD)\x3bJP6|RMII TXD1|must be ON for Ethernet".replace(/\x3b/g,";")))+"<p class=\"mut\">ON means fitted. SBx ON means closed by a 0 Ω link, OFF means open. Rx or Cx ON means soldered.</p>"+
sc2("HSE (high-speed clock)",tb(["Option","Settings"],"ST-LINK MCO 8 MHz (default)|SB45 ON, SB44, SB46, SB3, SB4 OFF\x3bX3 crystal 25 MHz (not fitted)|SB3, SB4 ON, SB44, SB46, SB45 OFF, C69 and C70 ON (5.6 pF)\x3bExternal oscillator on CN11 pin 29|SB46 ON, SB45, SB3, SB4 OFF\x3bHSE not used (PF0/PF1 are GPIO)|SB44, SB46 ON, SB45, SB3, SB4 OFF".replace(/\x3b/g,";")))+
sc2("LSE (32.768 kHz)",tb(["Option","Settings"],"X2 crystal (default)|SB40, SB41 OFF, R38, R39 ON\x3bExternal oscillator on CN11 pin 25|SB40, SB41 ON, R38, R39 OFF\x3bLSE not used (PC14/PC15 are GPIO)|SB40, SB41 ON, R38, R39 OFF".replace(/\x3b/g,";")))+
sc2("Virtual COM port",tb(["Pin","Default: ST-LINK VCP","To morpho"],"PD8 USART3 TX|SB19 ON (SB9, SB18, SB82 OFF)|SB82 ON (SB18, SB19 OFF)\x3bPD9 USART3 RX|SB12 ON (SB34, SB66, SB81 OFF)|SB81 ON (SB12, SB66 OFF)".replace(/\x3b/g,";"))+"<p class=\"mut\">LPUART1 (PB6/PB7) can use the VCP or Arduino D1/D0 through SB8, SB9, SB18, SB19, SB34, SB61, SB66 and SB68 (manual Table 11). The USART bootloader needs flying wires from PD8/PD9 to PB10/PB11 (CN15).</p>")+
sc2("USB OTG_FS pins",tb(["Pin","Function","CN13","Morpho"],"PA9|VBUS|SB23 ON|SB23 OFF\x3bPA10|ID|SB24 ON|SB24 OFF\x3bPA11|DM|SB21 ON, SB16 OFF|SB16 ON, SB21 OFF\x3bPA12|DP|SB22 ON, SB17 OFF|SB17 ON, SB22 OFF\x3bPD10|Power enable|SB77 ON|SB77 OFF\x3bPG7|Overcurrent|SB76 ON|SB76 OFF\x3bPA8|SOF|-|Test point TP4".replace(/\x3b/g,";")))+
sc2("Ethernet RMII pins",tb(["Pin","Function","Ethernet","Zio / morpho"],"PA1|REF_CLK|SB57 ON|SB57 OFF\x3bPA2|MDIO|SB72 ON|SB72 OFF\x3bPC1|MDC|SB64 ON|SB64 OFF\x3bPA7|CRS_DV|SB31 ON|SB31 OFF\x3bPC4|RXD0|SB36 ON|SB36 OFF\x3bPC5|RXD1|SB29 ON|SB29 OFF\x3bPG11|TX_EN|SB27 ON|SB27 OFF\x3bPG13|TXD0|SB30 ON|SB30 OFF\x3bPB13|TXD1|JP6 ON|JP6 OFF".replace(/\x3b/g,";"))+"<p class=\"mut\">SB7 must be OFF when these are used as RMII.</p>")+
sc2("Solder bridges",tb(["Bridge","What it does"],"SB1|3V3_PER to 3V3\x3bSB2|3V3 regulator output to 3V3\x3bSB80|1V8 regulator output to 1V8_VDD\x3bSB6|1V8 regulator input to 3V3_VDD\x3bSB5|OFF keeps level shifter U10 in use\x3bSB10 / SB11 / SB20|IOREF: OFF-ON-OFF = VDD_MCU, ON-OFF-OFF = 3V3_PER, OFF-OFF-ON = 3V3\x3bSB12 + SB19|ST-LINK VCP to PD9 / PD8\x3bSB32|PB3 SWO to ST-LINK (SB26 must be OFF)\x3bSB39 / SB47|LD1: ON-OFF = PB0, OFF-ON = PA5 (D13), OFF-OFF = none, ON-ON forbidden\x3bSB33 / SB35|D11: OFF-ON = PB5, ON-OFF = PA7\x3bSB45|ST-LINK MCO to PF0/PH0\x3bSB52|VBAT to VDD_MCU\x3bSB51 / SB58|B1: ON-OFF = PC13, OFF-ON = PA0, OFF-OFF = none\x3bSB75|PA0 to Zio CN10 pin 29\x3bSB74|MCU NRST to Ethernet PHY\x3bSB76 / SB77|USB overcurrent PG7 / USB power enable PD10\x3bSB13 / SB25|USB 3.3 V supply / VDD_MMC_1 to VDD_MCU\x3bSB14 / SB15|SDMMC_D0/D1 to CN12\x3bSB59 / SB63|PG6 QSPI_CS / PB2 QSPI_CLK\x3bSB71 / SB73|PE6: SAI_A_SD (D59) or TIMER_A_BKIN2 (D38)\x3bSB67|PE2 to SAI_A_MCLK (OFF keeps QSPI_BK1_IO2)\x3bSB53 / SB60 vs SB55 / SB62|A4/A5 are ADC (SB53, SB60 ON) or I²C PB9/PB8 (SB55, SB62 ON)\x3bSB28 / SB70|PE9: ON-OFF = PWM1 (CN10 pin 4), OFF-ON = COMP2_INP (CN9 pin 15)\x3bSB37 / SB38|A6 on PF4 (SB37 OFF, SB38 ON)\x3bSB48 / SB49|A7 on PF5 (SB48 ON, SB49 OFF)\x3bSB50 / SB54|A8 on PF6 (SB50 OFF, SB54 ON)\x3bSB65|PF11 is GPIO only\x3bSB81 / SB82|USART RX to CN11 / USART TX to CN12".replace(/\x3b/g,";"))+"<p class=\"mut\">SBxx are on the top layer and SB1xx on the bottom layer. The manual shows default states in bold, which the text I read didn’t preserve, so check Table 14 in UM2407 before cutting or bridging.</p>");
N.safety=sc2("Handling (UM2407 section 5)",ul(["This board is for people with basic electronics or embedded knowledge. It is not a toy and isn’t suited for children.","The header pins can be sharp. Handle it carefully.","It contains static-sensitive parts. Handle it in an ESD-safe environment.","While powered, don’t touch the connections with fingers or anything conductive. The voltage isn’t dangerous, but a short can damage parts.","Keep liquids away and avoid high humidity. Don’t operate a dirty or dusty board.","Before first use, inspect for shipping damage and check that nothing is loose in the bag."]))+
sc2("Powering",ul(["Use a SELV supply that meets EN 62368-1:2014+A11:2017.","Above 300 mA total, use an external supply. LD6 warns above 500 mA on USB.","Power the board before connecting CN13. Otherwise current can be injected into STM32H7 I/Os.","With an external supply and debugging, switch the supply on first and plug USB last (see Power).","3V3 external power leaves ST-LINK off: no programming or debugging."]))+
sc2("I/O and configuration cautions",ul(["MCU I/Os are 3.3 V, not 5 V like Arduino Uno V3. Check shields before use.","Remove R37 before using an Arduino shield that supplies VREF+ on CN7 pin 6.","PA13 and PA14 are shared with SWD. ST doesn’t recommend them as I/O.","SB39 and SB47 must never both be ON.","Removing JP4 without an ammeter leaves the MCU unpowered.","JP1 ON holds ST-LINK in reset, so there’s no debugging through CN1.","Don’t use Ethernet pins elsewhere while JP6 and the RMII bridges are ON.","For Arduino compatibility close SB55 and SB62 and open SB53, SB60 and SB65."]))+
sc2("Compliance and disposal",ul(["FCC Part 15, class B digital device. ISED ICES-003 class B. UKCA and CE (RoHS, EMC). EN55032 / CISPR32 class B, which may cause radio interference in homes.","Use only shielded cables.","In Europe, don’t put the board in household waste. Recycle it as electronic waste (WEEE).","Parts marked ‘ES’ or ‘E’ are engineering samples, not qualified for production."]))+
sc2("Your board",ul(["Product ID NUH723ZG$AT2, board MB1364-H723ZG-E01, MCU revision ‘Z’.","Revision E01 can measure Standby current because the Ethernet PHY is powered separately from VDD_MCU. The silkscreen on the morpho connectors was corrected in this revision."]));
N.lessons=[
{t:"Quick start",c:"mcu",x:"1) Check jumpers: JP1 OFF, JP2 [1-2], JP3 ON, JP4 ON, JP5 [1-2]. 2) Install the Nucleo USB driver if your PC needs it. 3) Plug a USB cable into CN1: LD5 and LD4 light and red LD3 blinks. 4) Press B1: the LD1–LD3 blink frequency changes.",code:""},
{t:"Check the jumpers",c:"jp2",x:"Defaults are in the Config tab. JP2 [1-2] is USB power, JP3 ON connects reset to ST-LINK, JP4 ON powers the MCU, JP5 [1-2] gives 3.3 V.",code:""},
{t:"Power it safely",c:"jp2",x:"Five sources: USB (default), VIN 7–12 V, E5V 5 V, USB charger, 3V3. Above 300 mA use an external supply. When debugging on VIN or EXT, power the supply first, check LD5, then plug in USB. See Power.",code:""},
{t:"Blink LD1 with Zephyr",c:"ld1",blink:"ld1",ms:500,x:"LD1 is PB0 by default (SB39 ON, SB47 OFF) and lights when HIGH.",code:"west build -b nucleo_h723zg samples/basic/blinky\nwest flash",log:["LD1 on","LD1 off"]},
{t:"Read the USER button",c:"b1",blink:"b1",ms:900,x:"B1 is PC13 by default (SB51 ON, SB58 OFF). Set SB58 ON and SB51 OFF for PA0 wake-up.",code:"",log:["B1 pressed","B1 released"]},
{t:"Console over the VCP",c:"stl",blink:"stl",ms:900,x:"With SB19 and SB12 ON, ST-LINK forwards USART3 (PD8 TX, PD9 RX) to your PC. Zephyr uses it for the console. (Simulated output.)",code:"west build -b nucleo_h723zg samples/hello_world\nwest flash\nscreen /dev/ttyACM0 115200",log:["Hello World! nucleo_h723zg"]},
{t:"Use an external debugger",c:"cn5",x:"Option 1: keep ST-LINK running, power it until COM LED is red, then connect the probe to CN5. Option 2: fit JP1 so ST-LINK is in reset with high-impedance GPIOs.",code:""},
{t:"Measure MCU current",c:"jp4",x:"Remove JP4 and put an ammeter across it. With JP4 OFF and no ammeter the MCU gets no power. Your E01 revision can measure Standby current.",code:""},
{t:"Pick 1.8 V or 3.3 V",c:"jp5",x:"JP5 [1-2] gives 3.3 V (default). [2-3] gives 1.8 V. At 1.8 V the debug level shifter U10 is used, so keep SB5 OFF.",code:""},
{t:"Use USB OTG safely",c:"usbotg",x:"Power the board first. CN13 can’t power it. Keep SB76 ON for OTG_FS. LD8 shows VBUS, LD7 shows overcurrent in Host mode.",code:""},
{t:"Set up Ethernet",c:"eth",x:"Keep JP6 and SB72 ON, plus the RMII bridges (SB57, SB64, SB36, SB29, SB30, SB27, SB31). The 25 MHz X4 clocks the PHY, which supplies the 50 MHz RMII clock.",code:""},
{t:"Know your clocks",c:"x2",x:"HSE is 8 MHz from ST-LINK by default. The 25 MHz X3 crystal isn’t fitted. LSE uses crystal X2 at 32.768 kHz.",code:""},
{t:"Fit an Arduino shield",c:"cn9",x:"Close SB55 and SB62, open SB53, SB60 and SB65 for I²C on A4/A5. I/Os are 3.3 V, not 5 V. Remove R37 if the shield supplies VREF+.",code:""},
{t:"FDCAN needs a transceiver",c:"cn9",x:"FDCAN1 is PD0 (RX, pin 25) and PD1 (TX, pin 27) on CN9. The board has no CAN transceiver, so add one.",code:""},

cv.onpointermove=e=>{if(dr){const dx=e.clientX-dr.x,dy=e.clientY-dr.y;dr.m+=Math.abs(dx)+Math.abs(dy);dr.x=e.clientX;dr.y=e.clientY;ry+=dx*.01;rx=Math.max(.1,Math.min(1.5,rx+dy*.01));render();return}
 const id=ray(e),hv=$("#hv");if(id!==hov){hov=id;paint(curOn);render()}
 if(!id){hv.style.display="none";return}
 const p=sp(id),r=$("#stage").getBoundingClientRect();hv.innerHTML=`<b>${p.n}</b><br>${p.d}`;hv.style.display="block";
 hv.style.left=Math.max(4,Math.min(e.clientX-r.left+14,r.width-hv.offsetWidth-6))+"px";hv.style.top=Math.max(4,Math.min(e.clientY-r.top+14,r.height-hv.offsetHeight-6))+"px"};
cv.onpointerleave=()=>{hov=null;$("#hv").style.display="none";paint(curOn);render()};
cv.onpointerup=e=>{if(dr&&dr.m<5)pick(ray(e));dr=null};
cv.addEventListener("wheel",e=>{e.preventDefault();zoom=Math.max(.5,Math.min(4,zoom*(e.deltaY>0?.9:1.1)));render()},{passive:false});
function pick(id){sel=id;const p=D[k].parts.find(x=>x.id===id);$("#tip").innerHTML=p?`<b>${p.n}</b><br><span class="mut">${p.d}${p.x?"<br><br>"+p.x:""}</span>`:`<b>${D[k].name}</b><br><span class="mut">Click any part to see what it does.</span>`;paint(null);render();if(tab==="Components")list()}
function stopRun(){clearInterval(timer);timer=null;paint(null)}
function run(){if(timer){stopRun();return ui()}const l=D[k].lessons[lesson];if(!l.blink)return;let on=false,i=0;logs=[];
 timer=setInterval(()=>{on=!on;paint(on?l.blink:null);if(l.log&&on){logs.push(l.log[i%l.log.length]);i++}render();const s=$("#ser");if(s){s.textContent=logs.join("\n");s.scrollTop=9e9}},l.ms);ui()}
function connUI(){const C=D[k].conn,c=C[cn];return "<div style=\"display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px\">"+Object.keys(C).map(n=>"<button class=\"item\" style=\"width:auto;padding:4px 10px;margin:0;"+(n===cn?"border-color:var(--acc)":"")+"\" data-cn=\""+n+"\">"+n+"</button>").join("")+"</div><h2>"+c.t+"</h2><p class=\"mut\">"+c.n+"</p>"+tb(c.h,c.r)}
const T=["Overview","Lessons","Components","Pinout","Connectors","Power","Config","Safety"];
function list(){const q=($("#q")?.value||"").toLowerCase();$("#cl").innerHTML=D[k].parts.filter(p=>!p.hid&&(p.n+p.d).toLowerCase().includes(q)).map(p=>`<button class="item ${sel===p.id?"on":""}" data-c="${p.id}"><b>${p.n}</b><span>${p.d}${sel===p.id&&p.x?"<br><br>"+p.x:""}</span></button>`).join("")}
function ui(){const b=D[k];$("#tabs").innerHTML=T.map(t=>`<button class="${t===tab?"on":""}" data-t="${t}">${t}</button>`).join("");let h="";
 if(tab==="Overview")h=`<h2>${b.name}</h2><p>${b.sub}</p><table>${b.spec.map(s=>`<tr><th>${s[0]}</th><td>${s[1]}</td></tr>`).join("")}</table>${b.more||""}<p class="note">${b.parts.filter(p=>!p.hid).length} modelled parts. Textures are your pictures wrapped over the 3D model; part heights are approximate.</p>`;
 if(tab==="Lessons"){const l=b.lessons[lesson];h=b.lessons.map((x,i)=>`<button class="item ${i===lesson?"on":""}" data-l="${i}"><b><i>${i+1}</i>${x.t}</b></button>`).join("");
  if(l)h+=`<h2 style="margin-top:12px">${l.t}</h2><p>${l.x}</p>${l.code?`<pre>${l.code.replace(/</g,"&lt;")}</pre>`:""}${l.blink?`<button class="run" id="rb">${timer?"Stop":"Run simulation"}</button>`:""}${l.log?`<p class="mut" style="margin-top:10px">Serial monitor ${timer?"· running":"· stopped"}</p><pre id="ser">${logs.join("\n")}</pre>`:""}`}
 if(tab==="Components")h=`<input id="q" placeholder="Filter parts…"><div id="cl"></div>`;
 if(tab==="Pinout")h=`<table><tr><th>Pin</th><th>Function</th><th>Note</th></tr>${b.pins.map(p=>`<tr><td><code>${p[0]}</code></td><td>${p[1]}</td><td class="mut">${p[2]}</td></tr>`).join("")}</table><p class="note">${b.note}</p>`;
 if(tab==="Connectors")h=connUI();if(tab==="Power")h=b.power;if(tab==="Config")h=b.cfg;if(tab==="Safety")h=b.safety;$("#body").innerHTML=h;if(tab==="Components"){list();$("#q").oninput=list}}
$("#fl").onclick=()=>setFlip(!flip);
$("#tabs").onclick=e=>{const t=e.target.dataset.t;if(t){tab=t;ui()}};
$("#body").onclick=e=>{const el=e.target.closest("button");if(!el)return;const d=el.dataset;
 if(d.l!==undefined){stopRun();lesson=+d.l;setFlip(!!D[k].lessons[lesson].flip);pick(D[k].lessons[lesson].c);ui()}
 if(d.c)pick(d.c);if(d.cn){cn=d.cn;const m={CN1:"usbstl",CN13:"usbotg",CN14:"eth"}[cn]||cn.toLowerCase();if(sp(m).id)pick(m);ui()}if(el.id==="rb")run()};
let ready=0;["nuc","nucB"].forEach(n=>{const im=new Image();im.onload=()=>{IM[n]=im;if(++ready===2){size();build();pick(null);ui()}};im.src=IMG[n]});
</script></body></html>
